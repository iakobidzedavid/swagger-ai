<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320">
  <!-- Background -->
  <rect width="300" height="320" fill="#0d1f33"/>

  <!-- Mug body -->
  <defs>
    <linearGradient id="mugFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f1d2d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#102542;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1d2d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rimGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a5c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1d2d;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Mug main body -->
  <path d="M 80 80 L 75 240 Q 75 260 95 270 L 205 270 Q 225 260 225 240 L 220 80 Z" fill="url(#mugFill)" stroke="#0a1420" stroke-width="1.5"/>

  <!-- Mug rim -->
  <ellipse cx="150" cy="80" rx="70" ry="15" fill="url(#rimGradient)" stroke="#0a1420" stroke-width="1.5"/>
  <ellipse cx="150" cy="78" rx="65" ry="10" fill="#1a3a5c" opacity="0.4"/>

  <!-- Design area on mug (large front panel) -->
  <rect x="95" y="110" width="110" height="130" rx="6" fill="#102542" stroke="#1a3a5c" stroke-width="1.5" opacity="0.8"/>

  <!-- Brand design - concentric circles with accent color -->
  <circle cx="150" cy="165" r="32" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
  <circle cx="150" cy="165" r="24" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.6"/>

  <!-- Brand text on design -->
  <text x="150" y="170" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#a78bfa">
    BRAND
  </text>

  <!-- Mug handle -->
  <path d="M 220 100 Q 250 140 245 200" stroke="#102542" stroke-width="22" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M 220 100 Q 250 140 245 200" stroke="#1a2f42" stroke-width="16" fill="none" stroke-linecap="round"/>

  <!-- Handle rim -->
  <path d="M 218 105 Q 248 145 243 200" stroke="#1a3a5c" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>

  <!-- Highlight on body for 3D effect -->
  <ellipse cx="110" cy="140" rx="12" ry="20" fill="#ffffff" opacity="0.08"/>

  <!-- Bottom base -->
  <ellipse cx="150" cy="270" rx="55" ry="8" fill="#0a1420" stroke="#0a1420" stroke-width="1"/>

  <!-- Text label -->
  <text x="150" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#ecebf3">
    Branded Mug
  </text>
</svg>
