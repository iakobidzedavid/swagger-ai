<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280">
  <!-- Background -->
  <rect width="300" height="280" fill="#0d1f33"/>

  <!-- Visor -->
  <ellipse cx="150" cy="110" rx="85" ry="25" fill="#0f1d2d" stroke="#0a1420" stroke-width="1.5"/>
  <ellipse cx="150" cy="105" rx="80" ry="20" fill="#1a2f42" stroke="#0a1420" stroke-width="0.5" opacity="0.7"/>

  <!-- Visor underside -->
  <path d="M 70 110 Q 150 125 230 110" stroke="#243750" stroke-width="1" fill="none"/>

  <!-- Cap crown (main body) -->
  <path d="M 80 105 Q 80 60 150 50 Q 220 60 220 105" fill="#102542" stroke="#0a1420" stroke-width="1.5"/>

  <!-- Cap panels with design space -->
  <path d="M 115 55 Q 115 70 125 100" fill="none" stroke="#1a3a5c" stroke-width="0.5" opacity="0.5"/>
  <path d="M 150 50 Q 150 70 150 100" fill="none" stroke="#1a3a5c" stroke-width="0.5" opacity="0.5"/>
  <path d="M 185 55 Q 185 70 175 100" fill="none" stroke="#1a3a5c" stroke-width="0.5" opacity="0.5"/>

  <!-- Front design area - violet accent -->
  <circle cx="150" cy="80" r="18" fill="none" stroke="#a78bfa" stroke-width="2"/>

  <!-- Brand initial/logo -->
  <text x="150" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#a78bfa">
    B
  </text>

  <!-- Cap strap/back -->
  <path d="M 85 105 Q 85 110 150 113 Q 215 110 215 105" fill="#102542" stroke="#0a1420" stroke-width="1"/>

  <!-- Strap detail -->
  <line x1="110" y1="108" x2="110" y2="115" stroke="#1a3a5c" stroke-width="1" opacity="0.6"/>
  <line x1="150" y1="108" x2="150" y2="118" stroke="#1a3a5c" stroke-width="1" opacity="0.6"/>
  <line x1="190" y1="108" x2="190" y2="115" stroke="#1a3a5c" stroke-width="1" opacity="0.6"/>

  <!-- Adjustable strap snaps -->
  <circle cx="95" cy="115" r="2.5" fill="#8fa3b8" opacity="0.6"/>
  <circle cx="205" cy="115" r="2.5" fill="#8fa3b8" opacity="0.6"/>

  <!-- Highlight/reflection -->
  <ellipse cx="110" cy="70" rx="8" ry="6" fill="#ffffff" opacity="0.1"/>

  <!-- Text label -->
  <text x="150" y="245" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#ecebf3">
    Branded Cap
  </text>
</svg>
